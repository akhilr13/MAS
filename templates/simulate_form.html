<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Announce Multiple Tasks</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <script>
    // Function to add a new task row dynamically
    function addTaskRow() {
      var container = document.getElementById("tasksContainer");
      var newRow = document.createElement("div");
      newRow.className = "taskRow mb-4 p-3 border rounded";
      newRow.innerHTML = `
        <div class="mb-2">
          <label class="form-label">Task Description:</label>
          <select name="description" class="form-select" required>
              <option value="" disabled selected>Select a task</option>
              <option value="Search and Rescue">Search and Rescue</option>
              <option value="Food Distribution">Food Distribution</option>
              <option value="Logistics">Logistics</option>
              <option value="Medical Assistance">Medical Assistance</option>
              <option value="Shelter Management">Shelter Management</option>
          </select>
        </div>
        <div class="mb-2">
          <label class="form-label">Deadline:</label>
          <input type="date" name="deadline" class="form-control" required>
        </div>
        <button type="button" class="btn btn-danger deleteTask">Delete Task</button>
      `;
      container.appendChild(newRow);
    }

    // Use event delegation to handle deletion of a task row
    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("tasksContainer").addEventListener("click", function(event) {
        if (event.target && event.target.classList.contains("deleteTask")) {
          event.target.parentElement.remove();
        }
      });
    });
  </script>
</head>
<body>
  <header class="bg-primary text-white py-3">
    <div class="container d-flex align-items-center">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="System Logo" width="80" class="me-3" />
      <h1 class="h4 mb-0">Disaster Management System</h1>
    </div>
  </header>

  <main class="container my-5">
    <h2 class="mb-4">Announce New Tasks</h2>
    <form action="/simulate" method="post">
      <div id="tasksContainer">
        <!-- Initial Task Row -->
        <div class="taskRow mb-4 p-3 border rounded">
          <div class="mb-2">
            <label class="form-label">Task Description:</label>
            <select name="description" class="form-select" required>
                <option value="" disabled selected>Select a task</option>
                <option value="Search and Rescue">Search and Rescue</option>
                <option value="Food Distribution">Food Distribution</option>
                <option value="Logistics">Logistics</option>
                <option value="Medical Assistance">Medical Assistance</option>
                <option value="Shelter Management">Shelter Management</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label">Deadline:</label>
            <input type="date" name="deadline" class="form-control" required>
          </div>
          <button type="button" class="btn btn-danger deleteTask">Delete Task</button>
        </div>
      </div>
      <button type="button" class="btn btn-secondary mb-3" onclick="addTaskRow()">Add Another Task</button>
      <br />
      <button type="submit" class="btn btn-primary">Announce Tasks & Run Simulation</button>
    </form>
    <a href="/" class="btn btn-link mt-3">Back to Home</a>
  </main>

  <footer class="bg-light text-center py-3">
    <div class="container">
      <p class="mb-0">&copy; 2025 Disaster Management | MAP Fusion</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
