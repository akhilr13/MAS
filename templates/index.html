<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Disaster Management System</title>
  <!-- Bootstrap CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <header class="bg-primary text-white py-3">
    <div class="container d-flex align-items-center">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="System Logo" width="80" class="me-3" />
      <h1 class="h3 mb-0">Welcome to the Disaster Management System</h1>
    </div>
  </header>

  <section class="hero position-relative">
    <div class="hero-overlay text-center text-white">
      <div class="container">
        <h2 class="display-5">Manage and Simulate Disaster Response</h2>
        <p class="lead">Announce tasks and see our multi-agent simulation in action.</p>
        <a href="/simulate" class="btn btn-lg btn-light mt-3">Announce Task(s)</a>
      </div>
    </div>
  </section>

  <footer class="bg-light text-center py-3 mt-5">
    <div class="container">
      <p class="mb-0">&copy; 2025 Disaster Management | MAP Fusion</p>
    </div>
  </footer>

  <!-- Bootstrap JS Bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
